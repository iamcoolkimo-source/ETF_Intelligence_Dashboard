name: Build WEB ETF Master V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Install pandas
        run: pip install pandas

      - name: Build WEB ETF Master V3
        run: python scripts/build_web_etf_master_v3.py

      - name: Commit Output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/WEB_ETF_MASTER_V3.csv

          git commit -m "Update WEB ETF Master V3" || echo "No changes"

          git pull --rebase origin main
          git push
