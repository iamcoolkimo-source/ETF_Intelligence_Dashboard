name: Sync Dashboard Data

on:

  repository_dispatch:
    types:
      - update-dashboard

  workflow_dispatch:

permissions:
  contents: write

jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Dashboard
        uses: actions/checkout@v4

      - name: Checkout ETF Intelligence
        uses: actions/checkout@v4
        with:
          repository: iamcoolkimo-source/ETF_Intelligence
          token: ${{ secrets.PAT_TOKEN }}
          path: source

      - name: Create Data Folder
        run: |
          mkdir -p docs/data

      - name: Copy Files
        run: |

          cp source/docs/data/WEB_ETF_MASTER_V5.csv docs/data/ || true

          cp source/data/ALL_HOLDING_DAILY.csv docs/data/ || true
          cp source/data/ETF_BUY_SELL_RANKING.csv docs/data/ || true
          cp source/data/ETF_BUY_SELL_HISTORY.csv docs/data/ || true

          cp source/data/ETF_NET_FLOW_RANKING.csv docs/data/ || true
          cp source/data/ETF_NET_FLOW_TOP10.csv docs/data/ || true

          cp source/data/ETF_ACCUMULATION_RANKING.csv docs/data/ || true

          cp source/data/SMART_MONEY.csv docs/data/ || true
          cp source/data/ACTIVE_ETF_FOCUS.csv docs/data/ || true
          cp source/data/ETF_DAILY_REPORT.csv docs/data/ || true
          cp source/data/HIGH_CONVICTION_STOCKS.csv docs/data/ || true

      - name: Commit Changes
        run: |

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data

          git commit -m "Sync data from ETF_Intelligence" || echo "No changes"

          git pull --rebase origin main

          git push
