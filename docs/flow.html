<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>ETF Flow Center</title>

<link rel="stylesheet" href="style.css">

<style>

.flow-header{
    margin-bottom:20px;
}

.matrix-section{
    margin-bottom:40px;
}

.matrix-table{

    width:100%;

    border-collapse:collapse;

    margin-bottom:30px;

}

.matrix-table th,
.matrix-table td{

    border:1px solid #ddd;

    padding:8px;

    text-align:center;

}

.matrix-table th{

    background:#163b52;

    color:white;

    font-weight:bold;

}

.matrix-table tr:nth-child(even){

    background:#f6f6f6;

}

</style>

</head>

<body>

<h1>ETF Flow Center</h1>

<div class="flow-header">

<button onclick="showDaily()">
最近5日
</button>

<button disabled>
最近5週(Coming Soon)
</button>

<button disabled>
最近5月(Coming Soon)
</button>

</div>

<div id="flow-content">

Loading...

</div>

<script src="flow.js"></script>

</body>
</html>
